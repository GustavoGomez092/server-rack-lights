name: led-notify
services:
  led-notify:
    container_name: led-notify
    image: led-notify:local
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    cap_add: [NET_RAW, NET_ADMIN, SYS_RAWIO, SYS_ADMIN]
    devices:
      - /dev/nvme0:/dev/nvme0
      - /dev/snd:/dev/snd
    environment:
      STRIP_ADDRESS: "A6:15:50:62:0A:9D"
      TZ: America/Los_Angeles
      DATA_DIR: /data
      PORT: "8787"
    volumes:
      - type: bind
        source: /run/dbus
        target: /run/dbus
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: /DATA
        target: /host/DATA
        read_only: true
      - type: bind
        source: /DATA/AppData/led-notify/data
        target: /data
      # Rack screen stats: per-app CPU/memory from the host's cgroups, and the host's name.
      - type: bind
        source: /sys/fs/cgroup
        target: /host/cgroup
        read_only: true
      - type: bind
        source: /etc/hostname
        target: /host/etc/hostname
        read_only: true
    labels:
      icon: http://192.168.4.61:8787/icon.svg
  # Draws the rack status page on the server's DisplayPort (seatd + cage + Chromium kiosk).
  # Separate so a browser crash never touches the LED strip; led-notify works without it.
  display:
    container_name: led-notify-display
    image: led-notify-display:local
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    cap_add: [SYS_TTY_CONFIG]
    devices:
      - /dev/dri:/dev/dri
      - /dev/tty0:/dev/tty0
      - /dev/tty1:/dev/tty1
    environment:
      TZ: America/Los_Angeles
    volumes:
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
x-casaos:
  main: led-notify
  index: /
  hostname: command.home.lab
  port_map: "80"
  scheme: http
  author: gustavogomez092
  category: Utilities
  architectures: [amd64]
  icon: http://192.168.4.61:8787/icon.svg
  title:
    en_us: Command Center
  tagline:
    en_us: LED strip alerts + rack status screen
  description:
    en_us: Shows internet, DNS, device, disk, CPU and container events on the BanlanX SP548E strip, and server status on the rack monitor (DisplayPort). Webhook at /api/events; status page at /screen/.
